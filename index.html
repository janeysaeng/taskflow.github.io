
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus. | Task Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script>
        // Critical: Defining 'process' and 'global' before any modules load
        // This prevents "process is not defined" errors in production environments
        window.process = {
            env: {
                DB_PATH: 'tasks.db',
                API_KEY: '' // Should be populated by the deployment environment
            }
        };
        window.global = window;

        // Emergency error catcher for debugging white screens
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Window Error:', msg, error);
            const root = document.getElementById('root');
            if (root && root.innerHTML === "") {
                root.innerHTML = '<div style="padding: 20px; color: #4c1d95; font-family: sans-serif;">' +
                    '<h2>Application Error</h2>' +
                    '<p>The application failed to start. This is often due to missing API keys or path issues.</p>' +
                    '<pre style="font-size: 10px; color: #666;">' + msg + '</pre>' +
                    '</div>';
            }
            return false;
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafaff;
            color: #2d1a4a;
            -webkit-font-smoothing: antialiased;
        }
        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input:focus {
            outline: none;
        }
        ::selection {
            background-color: #fef08a;
            color: #4c1d95;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e9d5ff;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d8b4fe;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
